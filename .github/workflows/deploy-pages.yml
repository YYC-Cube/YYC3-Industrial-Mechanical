name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间仅保留一次 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（冻结锁文件）
        run: pnpm install --frozen-lockfile

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 静态导出构建
        run: pnpm build

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
