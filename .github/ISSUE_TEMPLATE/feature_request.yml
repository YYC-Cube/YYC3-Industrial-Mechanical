name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚需求与场景，帮助我们评估价值与可行性。
        💡 提示：本项目为 **静态导出** 站点，依赖服务端动态能力的功能需先讨论部署方案。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 这个功能建议是否与某个痛点相关？请描述背景
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望看到怎样的实现或交互？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你考虑过哪些其他实现方式？

  - type: dropdown
    id: scope
    attributes:
      label: 功能影响范围
      multiple: true
      options:
        - UI / 交互
        - 模块系统
        - 国际化
        - 音效系统
        - 性能
        - 文档 / 工程化
        - 其他
