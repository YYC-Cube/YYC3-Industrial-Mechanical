name: 🐛 Bug 报告
description: 报告一个可复现的问题，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交问题报告！请尽量填写完整信息，以便我们快速定位。
        ⚠️ 若涉及**安全漏洞**，请勿在此公开披露，改为遵循 [SECURITY.md](../SECURITY.md) 的私密报告流程。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告
          required: true
        - label: 我已阅读 [CONTRIBUTING.md](../CONTRIBUTING.md)
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 Bug 是什么
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 访问 '...'
        2. 点击 '...'
        3. 观察到 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: 浏览器 / 环境
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - 微信内置浏览器
        - 移动端浏览器

  - type: input
    id: version
    attributes:
      label: 版本 / 环境信息
      description: 提交哈希、部署地址或本地开发环境
      placeholder: "例如：main@a1b2c3d，或本地 pnpm dev"

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      description: 粘贴浏览器控制台日志、构建输出或截图
      render: shell
