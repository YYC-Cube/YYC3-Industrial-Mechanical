# pnpm 12+ 配置（原 package.json 中的 pnpm 字段已迁移至此）
# 允许执行构建脚本的依赖白名单，保证 CI 安装可复现（pnpm 12 使用 allowBuilds）
allowBuilds:
  unrs-resolver: true

# 依赖收敛：修复传递依赖漏洞（对应 Dependabot/audit 告警）
overrides:
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  nanoid@3: ^3.3.20
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  source-map-js: ^1.2.2
  postcss: ^8.5.30
  postcss-selector-parser@6: ^6.1.3
  lodash: ^4.18.1

# 安全审计：仅忽略「无可用补丁 / 需破坏性大版本升级」的已知构建期依赖告警
# 详见 SECURITY.md 的「已知例外」章节，新增的高危/严重告警仍会阻断 CI
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3：暂无补丁版本（上游未发布修复）
    - GHSA-rj75-hqrm-r3gf # postcss-selector-parser <7.1.6：仅构建期 devDependency
